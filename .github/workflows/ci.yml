name: CI

on:
  push:
  pull_request:

jobs:
  static-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select LLVM 22 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=$(command -v clang-22)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v clang++-22)" >> "$GITHUB_ENV"

      - name: Install LLVM 22.1.8 (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: '22.1.8'
          directory: ${{ runner.temp }}/llvm-22
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
          env: true

      - name: Show compiler version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: '"$CXX" --version'

      - name: Show compiler version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& $env:CXX --version'

      - name: Configure
        run: cmake --preset release-static

      - name: Build ASTrein
        run: cmake --build --preset release-static --parallel 2

      - name: Test
        run: ctest --preset release-static

      - name: Verify no LLVM/Clang shared dependency (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ldd build/release-static/bin/astrein | grep -E 'lib(LLVM|clang)'; then
            echo 'Unexpected shared LLVM/Clang dependency' >&2
            exit 1
          fi

      - name: Verify no LLVM/Clang DLL dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = (dumpbin /dependents build/release-static/bin/astrein.exe | Out-String)
          if ($deps -match '(?im)^\s*(LLVM|clang).*\.dll\s*$') {
            throw "Unexpected shared LLVM/Clang dependency`n$deps"
          }
