name: CI

on:
  push:
    branches: ['main']
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  LLVM_VERSION: '22.1.8'

jobs:
  static-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            archive: astrein-linux-x86_64.tar.gz
          - os: ubuntu-26.04-arm
            archive: astrein-linux-aarch64.tar.gz
          - os: windows-2025
            archive: astrein-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select LLVM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          llvm_major="${LLVM_VERSION%%.*}"
          cc_path="$(command -v "clang-${llvm_major}")"
          cxx_path="$(command -v "clang++-${llvm_major}")"
          echo "CC=${cc_path}" >> "$GITHUB_ENV"
          echo "CXX=${cxx_path}" >> "$GITHUB_ENV"

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}
          directory: ${{ runner.temp }}/llvm-${{ env.LLVM_VERSION }}
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-win64.exe
          env: true

      - name: Show compiler version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: '"$CXX" --version'

      - name: Show compiler version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& $env:CXX --version'

      - name: Cache bundled LLVM build
        uses: actions/cache@v5
        with:
          path: |
            build/release-static/_deps
            build/release-static/.ninja_deps
            build/release-static/.ninja_log
          key: astrein-llvm-${{ matrix.os }}-${{ env.LLVM_VERSION }}-v2-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}

      - name: Configure
        run: cmake --preset release-static

      - name: Build ASTrein
        run: cmake --build --preset release-static --parallel 2

      - name: Test
        run: ctest --preset release-static

      - name: Verify no LLVM/Clang shared dependency (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ldd build/release-static/bin/astrein | grep -E 'lib(LLVM|clang)'; then
            echo 'Unexpected shared LLVM/Clang dependency' >&2
            exit 1
          fi

      - name: Verify no LLVM/Clang DLL dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = (dumpbin /dependents build/release-static/bin/astrein.exe | Out-String)
          if ($deps -match '(?im)^\s*(LLVM|clang).*\.dll\s*$') {
            throw "Unexpected shared LLVM/Clang dependency`n$deps"
          }

      - name: Install artifact contents
        run: cmake --install build/release-static --prefix build/package/astrein

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C build/package -czf "build/${{ matrix.archive }}" astrein

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path build/package/astrein
          -DestinationPath "build/${{ matrix.archive }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build/${{ matrix.archive }}
          if-no-files-found: error
          archive: false

  release-assets:
    if: github.event_name == 'release'
    needs: static-build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: astrein-*
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          release-assets/* --clobber
