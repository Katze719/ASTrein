name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  static-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            archive: astrein-linux-x86_64.tar.gz
          - os: windows-2025
            archive: astrein-windows-x86_64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Enable MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Select LLVM 22 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=$(command -v clang-22)" >> "$GITHUB_ENV"
          echo "CXX=$(command -v clang++-22)" >> "$GITHUB_ENV"

      - name: Install LLVM 22.1.8 (Windows)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: '22.1.8'
          directory: ${{ runner.temp }}/llvm-22
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
          env: true

      - name: Show compiler version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: '"$CXX" --version'

      - name: Show compiler version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& $env:CXX --version'

      - name: Configure
        run: cmake --preset release-static

      - name: Build ASTrein
        run: cmake --build --preset release-static --parallel 2

      - name: Test
        run: ctest --preset release-static

      - name: Verify no LLVM/Clang shared dependency (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ldd build/release-static/bin/astrein | grep -E 'lib(LLVM|clang)'; then
            echo 'Unexpected shared LLVM/Clang dependency' >&2
            exit 1
          fi

      - name: Verify no LLVM/Clang DLL dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deps = (dumpbin /dependents build/release-static/bin/astrein.exe | Out-String)
          if ($deps -match '(?im)^\s*(LLVM|clang).*\.dll\s*$') {
            throw "Unexpected shared LLVM/Clang dependency`n$deps"
          }

      - name: Install artifact contents
        run: cmake --install build/release-static --prefix build/package/astrein

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C build/package -czf "build/${{ matrix.archive }}" astrein

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path build/package/astrein
          -DestinationPath "build/${{ matrix.archive }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build/${{ matrix.archive }}
          if-no-files-found: error
          archive: false

  release-assets:
    if: github.event_name == 'release'
    needs: static-build
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: astrein-*
          path: release-assets
          merge-multiple: true

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          release-assets/* --clobber
